name: CI/CD - Deploy PaymentModule

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ASP.NET project
        run: |
          dotnet restore
          dotnet publish -c Release -o ./publish

      - name: Deploy to homelab server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/namph/PaymentModule/PRN222_PaymentModule
            echo "🧹 Stopping old web containers..."
            docker compose stop web1 web2 web3 || true
            echo "🔨 Rebuilding images..."
            docker compose build web1 web2 web3
            echo "🚀 Starting updated containers..."
            docker compose up -d web1 web2 web3
            echo "✅ Deployment completed! Database untouched."
