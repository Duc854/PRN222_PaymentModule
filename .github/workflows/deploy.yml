name: CI/CD Deploy Containers (Homelab)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ✅ Deploy bằng Docker Compose (chạy trực tiếp trên homelab)
      - name: Rebuild & Restart Docker Containers
        run: |
          cd /home/namph/PaymentModule/PRN222_PaymentModule
          echo "🧹 Stopping old containers..."
          docker compose stop web1 web2 web3 || true

          echo "🧩 Removing old containers (if exist)..."
          docker compose rm -f web1 web2 web3 || true

          echo "🔨 Rebuilding Docker images from updated source..."
          docker compose build web1 web2 web3

          echo "🚀 Starting updated containers..."
          docker compose up -d web1 web2 web3

          echo "✅ Done! Database (mssql-cloneebay) untouched."
